spring:
  application:
    name: raise-time-line
  datasource:
    url: jdbc:postgresql://localhost:5432/raisetimeline
    username: ${DB_USER:raisetime}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  storage:
    # local = サーバーのファイルシステムに保存 / s3 = AWS S3 に保存
    # 未設定なら local。設定漏れでS3が有効になり課金が発生する事故を防ぐため、安全な側を既定値にしている
    type: ${APP_STORAGE_TYPE:local}
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${APP_STORAGE_S3_REGION:ap-northeast-1}

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-change-32chars}
  access-token-validity: ${JWT_ACCESS_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:14d}

logging:
  level:
    root: INFO
    com.raisetech.raisetimeline: DEBUG
  # ログレベル表示のすぐ後ろに相関ID（requestId）と操作者（userId）を差し込む。
  # MDCに積むだけでは人間可読なコンソール出力には表示されないため、
  # 明示的にパターンへ組み込む必要がある（Spring Boot公式の推奨方法）。
  # userIdはJwtAuthenticationFilterが有効なトークンのときだけ積むので、未ログインのリクエストでは空になる。
  # 本番プロファイル（JSON形式）はMDCの値が自動でフィールドに乗るためこの設定は不要
  pattern:
    level: "%5p [reqId:%X{requestId}] [userId:%X{userId}]"
