plugins {
    id 'java'
    // テストがコードのどこを通ったかを計測する（カバレッジ）。Gradle 標準のプラグインで追加の依存は不要。
    // toolVersion は指定しない: Gradle 8.14.5 が既定で使う JaCoCo のバージョンに従う。
    // Gradle のバージョンは gradle-wrapper.properties で固定しているため、これでも結果は毎回同じになる
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.raisetech'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // AWS SDK for Java v2 の BOM。個々の依存にバージョンを書かず、ここで一括管理する
        mavenBom 'software.amazon.awssdk:bom:2.54.9'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'software.amazon.awssdk:s3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Mapper だけを読み込む @MybatisTest を使うために必要。
    // 本体の mybatis-spring-boot-starter と同じ 3.0.4 を指定する（別バージョンだと組み合わせが保証されない）
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') {
    options.compilerArgs << '-Xlint:deprecation'
}

// テストの実行件数をログに出す。afterSuite の中身は複数の Test タスクで共通利用する。
// Gradle は既定では結果の件数を表示しないため、テストが 1 件も実行されていなくても
// BUILD SUCCESSFUL と表示される。「緑になった」だけで検証されたと誤認しないための保険。
// desc.parent == null は「個々のクラスではなく全体の集計結果」を意味する
def printTestSummary = { desc, result ->
    if (desc.parent == null) {
        println "テスト結果: ${result.resultType} / 実行 ${result.testCount} 件 " +
                "(成功 ${result.successfulTestCount} / 失敗 ${result.failedTestCount} / スキップ ${result.skippedTestCount})"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // requiresIsolatedJvm は別タスク（structuredLoggingTest）で専用JVMで実行するため、
        // ここでは除外する。理由は StructuredLoggingConfigTest のクラスコメント参照
        excludeTags 'requiresIsolatedJvm'
    }

    afterSuite(printTestSummary)

    // テストが終わったら続けてカバレッジのレポートを作る。
    // 別コマンドにすると「テストは流したがレポートを見ていない」状態になりやすいため、自動でつなげる
    finalizedBy tasks.named('jacocoTestReport')
}

// ロギングの実体（Logback の LoggerContext）はJVM内で1つの共有状態のため、
// 異なる logging プロファイルを検証するテストは他のテストと同じJVMで動かすと
// 初期化が競合し、実行順序によって結果が変わってしまう（実機で確認済み）。
// そのため専用のタスクを切り、別JVMで実行する
tasks.register('structuredLoggingTest', Test) {
    description = '構造化ログのプロファイル切り替えを検証する（他のテストとログシステムの初期化が競合するため、専用JVMで実行する）'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'requiresIsolatedJvm'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // クラスごとに新しいJVMで実行する。このタスク内には異なる logging プロファイルを
    // 検証するテストクラスが複数あり、同じJVMで連続実行すると、先に起動した方の
    // ログ設定（Logback の LoggerContext はJVM内で共有）が後続に引き継がれてしまう
    forkEvery = 1
    afterSuite(printTestSummary)
}

tasks.named('check') {
    dependsOn tasks.named('structuredLoggingTest')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        // ブラウザで開いて、通っていない行を赤で確認するためのレポート
        html.required = true
        // XML/CSV は外部サービスへ送るための形式。今は使わないので作らない
        xml.required = false
        csv.required = false
    }
}

// jacocoTestCoverageVerification（一定%未満でビルドを失敗させる仕組み）は、あえて設定しない。
// 数値を満たすためだけの中身のないテストが生まれるため。
// カバレッジは「品質の証明」ではなく「テストが通っていない行の検出器」として使う。
